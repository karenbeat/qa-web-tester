<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja Girassol — Papelaria</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin:0; background:#faf9f7; color:#222; }
  header { background:#2d5016; color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; margin:0; }
  .carrinho-btn { background:#f4b942; color:#2d2d2d; border:0; padding:9px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  main { max-width:960px; margin:32px auto; padding:0 20px; }
  .aviso { background:#fff8e1; border-left:4px solid #f0ad4e; padding:12px 16px; font-size:14px; margin-bottom:24px; border-radius:0 4px 4px 0; }
  .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:20px; }
  .produto { background:#fff; border:1px solid #e5e2dc; border-radius:8px; padding:16px; }
  .produto .img { height:110px; background:#eef2e6; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:40px; }
  .produto h3 { font-size:15px; margin:12px 0 4px; }
  .preco { font-size:18px; font-weight:700; color:#2d5016; }
  .estoque { font-size:12px; color:#777; margin:4px 0 10px; }
  .produto button { width:100%; padding:8px; background:#2d5016; color:#fff; border:0; border-radius:5px; cursor:pointer; font-size:14px; }
  #carrinho { background:#fff; border:1px solid #e5e2dc; border-radius:8px; padding:20px; margin-top:32px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f0eeea; }
  .item input { width:60px; padding:5px; border:1px solid #ccc; border-radius:4px; }
  .total { display:flex; justify-content:space-between; font-size:19px; font-weight:700; margin-top:16px; }
  .finalizar { display:block; width:100%; margin-top:18px; padding:13px; background:#f4b942; color:#2d2d2d; border:0; border-radius:6px; font-size:16px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none; }
  .vazio { color:#888; padding:14px 0; }
</style>
</head>
<body>

<header>
  <h1>Loja Girassol</h1>
  <button class="carrinho-btn" id="btn-carrinho">Carrinho (<span id="qtd-carrinho">0</span>)</button>
</header>

<main>
  <p class="aviso">
    Loja fictícia para treino de QA. Contém defeitos propositais.
    Nenhum pedido é enviado a lugar nenhum.
  </p>

  <div class="grade" id="produtos"></div>

  <div id="carrinho">
    <h2 style="font-size:17px;margin:0 0 8px">Seu carrinho</h2>
    <div id="itens"><p class="vazio">Carrinho vazio.</p></div>
    <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
    <a href="checkout.html" class="finalizar" id="ir-checkout">Finalizar compra</a>
  </div>
</main>

<script>
const PRODUTOS = [
  {id:1, nome:'Caderno pautado A5',    preco: 32.90, estoque: 12, emoji:'📓'},
  {id:2, nome:'Caneta gel azul (kit)', preco: 24.50, estoque:  3, emoji:'🖊️'},
  {id:3, nome:'Marcador pastel 6un',   preco: 47.00, estoque:  8, emoji:'🖍️'},
  {id:4, nome:'Fita adesiva decorada', preco: 18.90, estoque:  0, emoji:'🎀'},
  {id:5, nome:'Planner 2027',          preco: 89.90, estoque:  5, emoji:'📔'},
];

let carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');

function brl(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }

function renderProdutos() {
  document.getElementById('produtos').innerHTML = PRODUTOS.map(p => `
    <div class="produto" data-testid="produto-${p.id}">
      <div class="img">${p.emoji}</div>
      <h3>${p.nome}</h3>
      <div class="preco">${brl(p.preco)}</div>
      <div class="estoque">${p.estoque > 0 ? p.estoque + ' em estoque' : 'Esgotado'}</div>
      <button id="add-${p.id}" data-testid="add-${p.id}">Adicionar</button>
    </div>`).join('');

  PRODUTOS.forEach(p => {
    document.getElementById('add-' + p.id).addEventListener('click', () => adicionar(p.id));
  });
}

// DEFEITO PROPOSITAL: não verifica se o produto está esgotado antes de adicionar.
function adicionar(id) {
  const existente = carrinho.find(i => i.id === id);
  if (existente) existente.qtd++;
  else carrinho.push({id, qtd: 1});
  salvar();
}

// DEFEITO PROPOSITAL: aceita quantidade zero e negativa, e não limita ao estoque.
function mudarQtd(id, valor) {
  const item = carrinho.find(i => i.id === id);
  if (item) item.qtd = parseInt(valor) || 0;
  salvar();
}

function remover(id) {
  carrinho = carrinho.filter(i => i.id !== id);
  salvar();
}

function salvar() {
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  renderCarrinho();
}

function renderCarrinho() {
  const div = document.getElementById('itens');
  document.getElementById('qtd-carrinho').textContent =
    carrinho.reduce((s, i) => s + i.qtd, 0);

  if (carrinho.length === 0) {
    div.innerHTML = '<p class="vazio">Carrinho vazio.</p>';
    document.getElementById('total').textContent = brl(0);
    return;
  }

  let total = 0;
  div.innerHTML = carrinho.map(i => {
    const p = PRODUTOS.find(x => x.id === i.id);
    total += p.preco * i.qtd;
    return `<div class="item">
      <span>${p.nome}</span>
      <span>
        <input type="number" id="qtd-${i.id}" data-testid="qtd-${i.id}" value="${i.qtd}">
        <strong style="margin:0 12px">${brl(p.preco * i.qtd)}</strong>
        <button id="rm-${i.id}" data-testid="remover-${i.id}"
                style="background:none;border:0;color:#c33;cursor:pointer">remover</button>
      </span></div>`;
  }).join('');

  document.getElementById('total').textContent = brl(total);
  localStorage.setItem('total', total.toFixed(2));

  carrinho.forEach(i => {
    document.getElementById('qtd-' + i.id)
      .addEventListener('change', e => mudarQtd(i.id, e.target.value));
    document.getElementById('rm-' + i.id)
      .addEventListener('click', () => remover(i.id));
  });
}

document.getElementById('btn-carrinho').addEventListener('click', () => {
  document.getElementById('carrinho').scrollIntoView({behavior: 'smooth'});
});

renderProdutos();
renderCarrinho();
</script>
</body>
</html>
